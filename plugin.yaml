name: octo
label: Octo
kind: platform
version: 0.1.3
description: >
  Octo (WuKongIM-based) gateway adapter for Hermes Agent.
  Connects via WebSocket binary protocol with ECDH+AES encryption,
  enabling bot-to-user and bot-to-group messaging, threads,
  @mentions, voice/video/file attachments, and final-only text replies.
author: Mininglamp-OSS
# ``requires_env`` entries are surfaced in ``hermes config`` UI via the
# platform-plugin env var injector in ``hermes_cli/config.py``.
requires_env:
  - name: OCTO_API_URL
    description: "Octo bot API base URL (e.g. https://api.botgate.cn)"
    prompt: "Octo API URL"
    password: false
  - name: OCTO_BOT_TOKEN
    description: "Octo bot authentication token"
    prompt: "Octo Bot Token"
    password: true
optional_env:
  - name: OCTO_CDN_URL
    description: "Optional CDN prefix for media acceleration"
    prompt: "CDN URL (optional)"
    password: false
  - name: OCTO_WS_URL
    description: "Optional WuKongIM WebSocket URL override"
    prompt: "WebSocket URL override (optional)"
    password: false
  - name: OCTO_ALLOW_PRIVATE_HOSTS
    description: "Allow only configured Octo API/CDN/WebSocket origins to resolve to private IPs; metadata endpoints stay blocked"
    prompt: "Allow configured private Octo hosts? (true/false)"
    password: false

  - name: OCTO_ON_BEHALF_OF
    description: "Trusted grantor user ID for authorized persona delivery"
    prompt: "Send on behalf of user ID (optional)"
    password: false
  - name: OCTO_EVENT_POLL_INTERVAL_S
    description: "Minimum event polling interval in seconds"
    prompt: "Event poll interval seconds (optional)"
    password: false
  - name: OCTO_EVENT_POLL_WAIT_S
    description: "Server long-poll hold in seconds; 0 disables long polling"
    prompt: "Event long-poll wait seconds (optional)"
    password: false
  - name: OCTO_EVENT_POLL_LIMIT
    description: "Maximum events requested per polling batch"
    prompt: "Event poll batch limit (optional)"
    password: false
  - name: OCTO_PROGRESS_CARD_RENDERER
    description: "Progress-card renderer: local (default) or registry"
    prompt: "Progress card renderer (optional)"
    password: false
  - name: OCTO_ALLOWED_USERS
    description: "Comma-separated Octo user IDs allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: OCTO_ALLOW_ALL_USERS
    description: "Allow any Octo user to trigger the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: OCTO_HOME_CHANNEL
    description: "Default group/chat ID for cron / notification delivery"
    prompt: "Home channel (or empty)"
    password: false
  - name: OCTO_CARD_MESSAGE_ENABLED
    description: "Legacy local Type-17 enablement fallback when the server has no card profile endpoint"
    prompt: "Enable legacy card messages? (1/0)"
    password: false
